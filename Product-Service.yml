
server:
  port: 8081
spring:
  application:
    name: Product-Service
  datasource:
    password: root
    url: jdbc:mysql://localhost:3306/productservice
    username: root
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    properties:
      show-sql: true

